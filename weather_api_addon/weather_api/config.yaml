name: "Ambient Weather → MQTT Bridge"
slug: "ambient_weather_mqtt"
description: "Receives Ambient Weather WS-2902 reports and publishes to MQTT"
version: "1.0.1"
startup: services
boot: auto
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
init: false

host_network: true

options:
  broker_host: core-mosquitto
  broker_port: 1883
  mqtt_username: weather_api
  mqtt_password: ""
  message_topic: weather
  listen_port: 4000

schema:
  broker_host: str
  broker_port: int
  mqtt_username: str
  mqtt_password: password
  message_topic: str
  listen_port: int
